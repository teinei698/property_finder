<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scout Trust Check: prototype</title>
<style>
  :root { --red:#e8453c; --ink:#1d1d1f; --mute:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --ok:#15803d; --okbg:#e8f6ec; --warn:#b45309; --warnbg:#fff4e0; --bad:#b91c1c; --badbg:#fde8e8; --info:#1d4ed8; --infobg:#e8effd; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#dfe3e8; }
  .app { max-width:430px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:72px; }
  header { background:#fff; padding:12px 14px 8px; position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; }
  .brand .dot { width:22px; height:22px; border-radius:6px; background:var(--red); }
  .proto { margin-left:auto; font-size:11px; font-weight:600; color:var(--mute); border:1px solid var(--line); border-radius:10px; padding:2px 8px; }
  .search { margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--mute); font-size:14px; }
  .tabs { display:flex; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:5px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .row { display:flex; gap:6px; overflow-x:auto; margin-top:6px; padding-bottom:2px; }
  .scoutbar { margin:10px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .scoutbar .top { display:flex; align-items:center; gap:8px; }
  .scoutbar b { font-size:14px; }
  .switch { margin-left:auto; width:44px; height:26px; border-radius:13px; background:#ccc; position:relative; cursor:pointer; flex:none; }
  .switch::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.15s; }
  .switch.on { background:var(--ok); } .switch.on::after { left:21px; }
  .sum { font-size:13px; color:var(--mute); margin-top:4px; }
  .sum strong { color:var(--ink); }
  .btn { display:block; width:100%; border:0; border-radius:10px; padding:12px; font-weight:600; font-size:15px; cursor:pointer; }
  .btn.primary { background:var(--red); color:#fff; } .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); } .btn.small { padding:8px; font-size:13px; }
  .card { background:#fff; margin:10px 12px; border-radius:12px; overflow:hidden; border:1px solid var(--line); cursor:pointer; }
  .card img { width:100%; height:170px; object-fit:cover; display:block; background:#eee; }
  .card .body { padding:10px 12px; }
  .price { font-size:18px; font-weight:700; }
  .meta { color:var(--mute); font-size:13px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; border-radius:8px; padding:2px 8px; margin:6px 4px 0 0; }
  .b-trust { background:var(--okbg); color:var(--ok); } .b-ask { background:var(--warnbg); color:var(--warn); } .b-bad { background:var(--badbg); color:var(--bad); } .b-info { background:var(--infobg); color:var(--info); } .b-paid { background:#f3f4f6; color:#374151; }
  .why { font-size:13px; margin-top:6px; color:#374151; }
  .why li { margin:2px 0; }
  .rid { font-family:ui-monospace,monospace; font-size:11px; color:var(--mute); margin-right:4px; }
  .section { margin:16px 14px 4px; font-size:13px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.03em; }
  .drawer { margin:10px 12px; border:1px dashed #c7cbd1; border-radius:12px; background:#fff; }
  .drawer summary { padding:12px; cursor:pointer; font-weight:600; }
  nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:#fff; border-top:1px solid var(--line); display:flex; z-index:6; }
  nav button { flex:1; border:0; background:none; padding:10px 0 14px; font-size:12px; color:var(--mute); cursor:pointer; }
  nav button.on { color:var(--red); font-weight:700; }
  .count { background:var(--red); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; margin-left:3px; }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:none; }
  .sheet { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:430px; max-height:92vh; overflow:auto; background:#fff; border-radius:16px 16px 0 0; z-index:21; display:none; }
  .sheet img { width:100%; height:210px; object-fit:cover; display:block; }
  .pad { padding:14px; }
  .close { position:sticky; top:0; float:right; margin:8px; border:0; background:#fff; border-radius:50%; width:32px; height:32px; font-size:18px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .box { border-radius:12px; padding:10px 12px; margin:10px 0; font-size:14px; }
  .box h4 { margin:0 0 6px; font-size:14px; }
  .box ul { margin:0; padding-left:18px; }
  .q { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .q input { margin-top:3px; }
  .thread { background:#fff; margin:10px 12px; border-radius:12px; border:1px solid var(--line); padding:10px 12px; }
  .bubble { border-radius:12px; padding:8px 10px; margin:6px 0; font-size:13px; max-width:88%; }
  .me { background:#eef2ff; margin-left:auto; } .them { background:#f3f4f6; } .scout { background:var(--okbg); }
  .muted { color:var(--mute); font-size:12px; }
  .note { font-size:12px; color:var(--mute); margin:8px 14px; }
  a { color:var(--info); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .empty { text-align:center; color:var(--mute); padding:40px 20px; }
  .entry { background:#111827; color:#fff; border-radius:12px; padding:10px 12px; margin:10px 12px; font-size:13px; }
  .entry b { color:#fff; }

  .scout { margin:10px 12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; }
  .scout h3 { margin:0 0 4px; font-size:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .opt { border:1px solid #d1d5db; background:#fff; border-radius:18px; padding:7px 12px; font-size:14px; cursor:pointer; }
  .opt.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .opt.go { background:var(--red); color:#fff; border-color:var(--red); font-weight:600; }
  .say { background:var(--okbg); border-radius:12px 12px 12px 4px; padding:8px 10px; margin:8px 0 4px; font-size:14px; max-width:92%; }
  .you { background:#eef2ff; border-radius:12px 12px 4px 12px; padding:6px 10px; margin:4px 0 4px auto; font-size:14px; width:fit-content; max-width:85%; }
  .log { font-size:13px; color:#374151; margin:2px 0; }
  .fit { display:inline-block; font-size:12px; border-radius:8px; padding:2px 7px; margin:4px 4px 0 0; background:#f3f4f6; }
  .fit.y { background:var(--okbg); color:var(--ok); } .fit.n { background:var(--warnbg); color:var(--warn); }
  .rank { font-size:12px; font-weight:700; color:var(--red); }
  .cost { font-size:12px; color:var(--mute); margin-top:4px; }
  .agentsaid { background:#f3f4f6; border-radius:10px; padding:6px 8px; font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="dot"></div>Property Finder <span class="proto">Prototype · not affiliated</span></div>
    <div class="search">🔍 Elite Residence, Dubai Marina</div>
    <div class="tabs">
      <span class="chip on" data-mode="R">Rent</span>
      <span class="chip" data-mode="S">Buy</span>
    </div>
    <div class="row" id="filters"></div>
  </header>
  <main id="main"></main>
</div>
<nav>
  <button id="nav-search" class="on">🔍<br>Search</button>
  <button id="nav-list">⭐<br>My short list <span id="navcount"></span></button>
  <button id="nav-about">ℹ️<br>How it works</button>
</nav>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>

<script src="data.js"></script>
<script src="rules.js"></script>
<script src="agents.js"></script>
<script src="app.js"></script>
</body>
</html>
